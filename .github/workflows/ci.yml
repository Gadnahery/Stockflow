name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Smoke test (every screen renders)
        run: npm run test
      - name: Build
        run: npm run build
